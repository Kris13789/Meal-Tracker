<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="login-brand-mark" aria-hidden="true">
                <svg class="login-chef-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor">
                    <path d="M8.49,12.68v4.61c0,.34,.23,.61,.53,.71v5.48c0,.13-.14,3.21,1.88,5.34,1.22,1.28,2.93,1.94,5.09,1.94s3.88-.65,5.09-1.94c2.02-2.13,1.89-5.21,1.88-5.3v-5.52c.3-.1,.53-.37,.53-.71v-4.61c1.71-.69,2.92-2.36,2.92-4.32,0-2.57-2.09-4.67-4.67-4.67-.49,0-.98,.08-1.46,.23-1.09-1.67-2.93-2.68-4.94-2.68s-3.68,.91-4.79,2.46c-2.74-.22-5.01,1.96-5.01,4.65,0,1.96,1.21,3.63,2.92,4.32Zm11.51,15.11c-.92,.97-2.27,1.46-4,1.46s-3.07-.49-4-1.46c-1.58-1.66-1.48-4.21-1.48-4.28v-5.48h10.96v5.51s.1,2.58-1.48,4.24Zm2.01-14.77v3.51H9.99v-3.51h12.02ZM10.23,5.19c.21,0,.4,.02,.59,.05,.3,.05,.61-.09,.77-.35,.81-1.34,2.22-2.15,3.78-2.15,1.68,0,3.19,.94,3.95,2.45,.09,.18,.25,.31,.43,.38,.19,.06,.39,.05,.57-.04,.45-.23,.95-.35,1.44-.35,1.75,0,3.17,1.42,3.17,3.17s-1.42,3.17-3.17,3.17H10.23c-1.75,0-3.17-1.42-3.17-3.17s1.42-3.17,3.17-3.17Z"/>
                    <path d="M14.26,5.25c1.5,.28,2.59,1.59,2.59,3.11,0,.41,.34,.75,.75,.75s.75-.34,.75-.75c0-2.24-1.6-4.17-3.81-4.59-.4-.07-.8,.19-.88,.6-.08,.41,.19,.8,.6,.88Z"/>
                    <circle cx="13.32" cy="20.07" r="1.25"/>
                    <circle cx="18.68" cy="20.07" r="1.25"/>
                    <path d="M17.56,24.5h-3.12c-.41,0-.75,.34-.75,.75s.34,.75,.75,.75h3.12c.41,0,.75-.34,.75-.75s-.34-.75-.75-.75Z"/>
                </svg>
            </div>
            <h1>Meal Tracker</h1>
            <button type="button" id="googleSignInBtn" class="google-sign-in-btn">
                <svg class="google-sign-in-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24" height="24" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Continue with Google</span>
            </button>
            <button id="signOutBtn" type="button" class="link-btn auth-link-btn header-sign-out" aria-label="Sign out" title="Sign out">
                <svg class="header-sign-out-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M18 9l3 3m0 0l-3 3m3-3H9" />
                </svg>
            </button>
        </header>

        <div id="globalBanner" class="global-banner" style="display: none;" aria-live="polite">
            <div id="globalMessage" class="message" role="alert"></div>
            <button type="button" id="backToLoginBtn" class="link-btn global-banner-login">← Back to log in</button>
        </div>

        <main id="appContent" style="display: none;">
            <!-- Home View -->
            <div id="homeView" class="view">
                <form id="mealForm">
                    <div class="input-group">
                        <label for="mealDescription">Enter your meal:</label>
                        <textarea 
                            id="mealDescription" 
                            name="description" 
                            placeholder="What did you eat?"
                            rows="4"
                        ></textarea>
                    </div>
                    
                    <div id="message" class="message"></div>
                    
                    <button type="submit" id="saveButton" class="save-btn">
                        Save
                    </button>
                </form>
                
                <button id="viewMealsBtn" class="link-btn">
                    My logged meals
                </button>
            </div>
            
            <!-- Meals List View -->
            <div id="mealsView" class="view" style="display: none;">
                <div class="meals-header">
                    <button id="backBtn" class="link-btn">← Back</button>
                    <h2>My Logged Meals</h2>
                    <button id="analyzeMealsBtn" type="button" class="analyze-btn">Analyze Meals</button>
                </div>
                
                <div id="mealsTableContainer" class="table-container">
                    <table id="mealsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Meal</th>
                            </tr>
                        </thead>
                        <tbody id="mealsTableBody">
                            <!-- Meals will be loaded here -->
                        </tbody>
                    </table>
                    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                        Loading more meals...
                    </div>
                    <div id="noMoreMeals" class="no-more-meals" style="display: none;">
                        No more meals to load
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="analysisModal" class="analysis-modal" style="display: none;" aria-hidden="true">
        <div id="analysisModalBackdrop" class="analysis-modal-backdrop"></div>
        <section
            class="analysis-modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="analysisModalTitle"
        >
            <header class="analysis-modal-header">
                <h3 id="analysisModalTitle">Meal Analysis</h3>
                <button
                    id="analysisModalCloseBtn"
                    type="button"
                    class="analysis-modal-close-btn"
                    aria-label="Close meal analysis"
                >
                    ×
                </button>
            </header>
            <div id="analysisModalBody" class="analysis-modal-body"></div>
        </section>
    </div>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
