<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>Meal Tracker</h1>
            <button type="button" id="googleSignInBtn" class="google-sign-in-btn">
                <svg class="google-sign-in-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24" height="24" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Continue with Google</span>
            </button>
            <button id="signOutBtn" type="button" class="link-btn auth-link-btn header-sign-out" aria-label="Sign out" title="Sign out">
                <svg class="header-sign-out-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M18 9l3 3m0 0l-3 3m3-3H9" />
                </svg>
            </button>
        </header>

        <div id="globalBanner" class="global-banner" style="display: none;" aria-live="polite">
            <div id="globalMessage" class="message" role="alert"></div>
            <button type="button" id="backToLoginBtn" class="link-btn global-banner-login">← Back to log in</button>
        </div>

        <main id="appContent" style="display: none;">
            <!-- Home View -->
            <div id="homeView" class="view">
                <form id="mealForm">
                    <div class="input-group">
                        <label for="mealDescription">Enter your meal:</label>
                        <textarea 
                            id="mealDescription" 
                            name="description" 
                            placeholder="What did you eat?"
                            rows="4"
                        ></textarea>
                    </div>
                    
                    <div id="message" class="message"></div>
                    
                    <button type="submit" id="saveButton" class="save-btn">
                        Save
                    </button>
                </form>
                
                <button id="viewMealsBtn" class="link-btn">
                    My logged meals
                </button>
            </div>
            
            <!-- Meals List View -->
            <div id="mealsView" class="view" style="display: none;">
                <div class="meals-header">
                    <button id="backBtn" class="link-btn">← Back</button>
                    <h2>My Logged Meals</h2>
                </div>
                
                <div id="mealsTableContainer" class="table-container">
                    <table id="mealsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Meal</th>
                            </tr>
                        </thead>
                        <tbody id="mealsTableBody">
                            <!-- Meals will be loaded here -->
                        </tbody>
                    </table>
                    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                        Loading more meals...
                    </div>
                    <div id="noMoreMeals" class="no-more-meals" style="display: none;">
                        No more meals to load
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
