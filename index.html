<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="appTitle" class="app-title">Meal Tracker</h1>
            <div id="authBar" class="auth-bar" style="display: none;">
                <span id="userEmail" class="user-email"></span>
                <button id="signOutBtn" class="link-btn auth-link-btn">Sign out</button>
            </div>
        </header>

        <main id="appContent" style="display: none;">
            <!-- Home View -->
            <div id="homeView" class="view">
                <form id="mealForm">
                    <div class="input-group">
                        <label for="mealDescription">Enter your meal:</label>
                        <textarea 
                            id="mealDescription" 
                            name="description" 
                            placeholder="What did you eat?"
                            rows="4"
                        ></textarea>
                    </div>
                    
                    <div id="message" class="message"></div>
                    
                    <button type="submit" id="saveButton" class="save-btn">
                        Save
                    </button>
                </form>
                
                <button id="viewMealsBtn" class="link-btn">
                    My logged meals
                </button>
            </div>
            
            <!-- Meals List View -->
            <div id="mealsView" class="view" style="display: none;">
                <div class="meals-header">
                    <button id="backBtn" class="link-btn">← Back</button>
                    <h2>My Logged Meals</h2>
                </div>
                
                <div id="mealsTableContainer" class="table-container">
                    <table id="mealsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Meal</th>
                            </tr>
                        </thead>
                        <tbody id="mealsTableBody">
                            <!-- Meals will be loaded here -->
                        </tbody>
                    </table>
                    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                        Loading more meals...
                    </div>
                    <div id="noMoreMeals" class="no-more-meals" style="display: none;">
                        No more meals to load
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
